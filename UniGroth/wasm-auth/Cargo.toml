[package]
name = "unigroth-wasm-auth"
version = "0.1.0"
edition = "2021"
authors = ["MeridianAlgo"]
description = "Browser-targeted UniGroth proving / verification for the auth circuit"
license = "MIT/Apache-2.0"
repository = "https://github.com/MeridianAlgo/UniGroth"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
unigroth = { path = "..", default-features = false, features = ["std"] }

ark-bn254 = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false, features = ["curve"] }
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git", default-features = false }
ark-snark = { git = "https://github.com/arkworks-rs/snark.git", default-features = false }
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
ark-relations = { git = "https://github.com/arkworks-rs/snark.git", default-features = false }

wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
rand_chacha = { version = "0.3", default-features = false }
console_error_panic_hook = { version = "0.1", optional = true }
sha2 = { version = "0.10", default-features = false }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Workspace member: inherits [patch.crates-io] from ../Cargo.toml
