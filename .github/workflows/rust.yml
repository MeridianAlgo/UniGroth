name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          UniGroth/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('UniGroth/Cargo.lock') }}

    - name: Run Build
      run: cargo build --verbose
      working-directory: ./UniGroth

    - name: Run Tests
      run: cargo test --verbose
      working-directory: ./UniGroth
