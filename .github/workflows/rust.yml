name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          UniGroth/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('UniGroth/Cargo.lock') }}

    - name: Run fmt check
      run: cargo fmt --check
      working-directory: ./UniGroth

    - name: Run Build
      run: cargo build --verbose
      working-directory: ./UniGroth

    - name: Run Clippy
      run: cargo clippy -- -D warnings
      working-directory: ./UniGroth

    - name: Run Tests
      run: cargo test --workspace --verbose
      working-directory: ./UniGroth

  js_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Run JS reference tests
      run: npm test
